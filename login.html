<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Gestão IPTV</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .box {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #1e293b;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 24px;
    }

    p {
      text-align: center;
      color: #64748b;
      margin-bottom: 24px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .erro {
      margin-top: 14px;
      text-align: center;
      color: #dc2626;
      font-size: 14px;
      display: none;
    }

    .ok {
      margin-top: 14px;
      text-align: center;
      color: #16a34a;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Gestão IPTV</h1>
    <p>Entre para acessar seu painel</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="seuemail@email.com" />

    <label>Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha" />

    <button onclick="login()">Entrar</button>

    <div class="erro" id="erro"></div>
    <div class="ok" id="ok"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://tfhwwasxecqkyccprupc.supabase.co";

    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmaHd3YXN4ZWNxa3ljY3BydXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDY0MTQsImV4cCI6MjA5NDYyMjQxNH0.5K-tzFe7DuUT7nQqJOd183nHyCYD3g979xoLH-VA0qw";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const erro = document.getElementById("erro");
      const ok = document.getElementById("ok");

      erro.style.display = "none";
      ok.style.display = "none";

      if (!email || !senha) {
        erro.innerText = "Preencha email e senha.";
        erro.style.display = "block";
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (error) {
        erro.innerText = "Email ou senha inválidos.";
        erro.style.display = "block";
        return;
      }

      ok.innerText = "Login realizado com sucesso!";
      ok.style.display = "block";

      window.location.href = "/";

    }
  </script>
</body>
</html>
